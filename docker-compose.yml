services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: roomora-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-roomora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-roomora}
      POSTGRES_DB: roomora
    ports:
      - "5432:5432"
    volumes:
      - roomora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-roomora} -d roomora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: roomora-redis
    ports:
      - "6379:6379"
    volumes:
      - roomora_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  roomora_pgdata:
  roomora_redisdata:
