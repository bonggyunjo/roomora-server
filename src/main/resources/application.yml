spring:
  application:
    name: roomora-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roomora}
    username: ${DB_USERNAME:roomora}
    password: ${DB_PASSWORD:roomora}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:local-kakao-placeholder}
            client-secret: ${KAKAO_CLIENT_SECRET:local-kakao-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname, account_email
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-secret}
            scope: profile, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET:roomora-local-dev-secret-key-must-be-at-least-32-bytes-long}
  access-expiration-ms: ${JWT_ACCESS_EXP_MS:1800000}
  refresh-expiration-ms: ${JWT_REFRESH_EXP_MS:1209600000}

app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/auth/callback}
  ai:
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    chat-model: ${AI_CHAT_MODEL:gpt-4o-mini}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
    daily-limit: ${RAG_DAILY_LIMIT:20}
    cache-ttl-minutes: ${RAG_CACHE_TTL_MINUTES:30}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:8}

resilience4j:
  circuitbreaker:
    instances:
      ragAi:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s

server:
  port: ${SERVER_PORT:8080}
