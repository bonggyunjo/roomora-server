name: Roomora Server CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest
    needs: secret-scan

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: roomora
          POSTGRES_PASSWORD: roomora_test_password
          POSTGRES_DB: roomora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Tests & Build
        run: gradle test build
        env:
          DB_URL: jdbc:postgresql://localhost:5432/roomora_test
          DB_USERNAME: roomora
          DB_PASSWORD: roomora_test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
