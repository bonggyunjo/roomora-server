spring:
  application:
    name: roomora-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roomora}
    username: ${DB_USERNAME:roomora}
    password: ${DB_PASSWORD:roomora}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}
